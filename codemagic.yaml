workflows:
  android-prueba:
    name: Pavito - APK de prueba
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - SUPABASE_ACCESS_TOKEN
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Actualizar base de datos (Supabase)
        ignore_failure: true
        script: python3 tools/migrar.py
      - name: Subir funciones del servidor (IA)
        ignore_failure: true
        script: |
          npx -y supabase@2 functions deploy escanear --project-ref udhyuyokrxggdnnepbmr --use-api
          npx -y supabase@2 functions deploy push --project-ref udhyuyokrxggdnnepbmr --use-api --no-verify-jwt
      - name: Generar la parte Android del proyecto
        script: |
          cd app
          flutter create --platforms=android --org com.pavito --project-name pavito .
          perl -pi -e 's/android:label="[^"]*"/android:label="Pavito"/' android/app/src/main/AndroidManifest.xml
          for d in android_icons/mipmap-*; do cp "$d/ic_launcher.png" "android/app/src/main/res/$(basename $d)/ic_launcher.png"; done
          cp -r android_overrides/res/. android/app/src/main/res/
          python3 ../tools/android_manifest.py android/app/src/main/AndroidManifest.xml
      - name: Instalar dependencias
        script: cd app && flutter pub get
      - name: Revisar el código
        ignore_failure: true
        script: cd app && flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error|Error" | head -60
      - name: Compilar APK
        ignore_failure: true
        script: |
          set -o pipefail
          cd app && flutter build apk --debug 2>&1 | tee ../build.log
      - name: Resumen del resultado
        script: |
          if ls app/build/app/outputs/flutter-apk/*.apk >/dev/null 2>&1; then
            echo "APK LISTO"
          else
            echo "=== ERRORES DE LA COMPILACION ==="
            grep -nE "error:|Error:|What went wrong|FAILURE|\.dart:[0-9]+" -A2 build.log | head -70
            exit 1
          fi
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk

  base-de-datos:
    name: Pavito - Actualizar base de datos
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      groups:
        - SUPABASE_ACCESS_TOKEN
    scripts:
      - name: Aplicar las migraciones nuevas
        script: python3 tools/migrar.py
      - name: Subir funciones del servidor (IA)
        script: |
          npx -y supabase@2 functions deploy escanear --project-ref udhyuyokrxggdnnepbmr --use-api
          npx -y supabase@2 functions deploy push --project-ref udhyuyokrxggdnnepbmr --use-api --no-verify-jwt

  copia-seguridad:
    name: Pavito - Copia de seguridad
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      groups:
        - copia   # SUPABASE_DB_URL (Session pooler) y COPIA_CLAVE
    scripts:
      - name: Instalar pg_dump
        script: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install libpq >/dev/null
          command -v gpg >/dev/null || brew install gnupg >/dev/null
          "$(brew --prefix libpq)/bin/pg_dump" --version
      - name: Copiar y cifrar
        script: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ] || [ -z "${COPIA_CLAVE:-}" ]; then echo "Faltan SUPABASE_DB_URL o COPIA_CLAVE en el grupo 'copia'"; exit 1; fi
          F=pavito-$(date -u +%Y-%m-%d)
          "$(brew --prefix libpq)/bin/pg_dump" "$SUPABASE_DB_URL" -Fc --no-owner --no-privileges \
            -n public -n interno -n auth -n storage -f "$F.dump"
          ls -lh "$F.dump"
          "$(brew --prefix libpq)/bin/pg_restore" -l "$F.dump" | grep -c "TABLE DATA" | xargs echo "Tablas con datos:"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$COPIA_CLAVE" --symmetric --cipher-algo AES256 -o "$F.dump.gpg" "$F.dump"
          rm -f "$F.dump"
    artifacts:
      - pavito-*.dump.gpg
