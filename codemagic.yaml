workflows:
  android-prueba:
    name: La Percha - APK de prueba
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Generar la parte Android del proyecto
        script: |
          cd app
          flutter create --platforms=android --org com.lapercha --project-name la_percha .
          sed -i 's/android:label="[^"]*"/android:label="La Percha"/' android/app/src/main/AndroidManifest.xml
      - name: Instalar dependencias
        script: cd app && flutter pub get
      - name: Compilar APK
        script: cd app && flutter build apk --debug
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
