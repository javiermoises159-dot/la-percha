name: Compilar app Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar la parte Android del proyecto
        run: flutter create --platforms=android --org com.pavito --project-name pavito .
      - name: Nombre visible de la app
        run: sed -i 's/android:label="[^"]*"/android:label="La Percha"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Publicar el APK como descarga
        uses: softprops/action-gh-release@v3
        with:
          tag_name: prueba-android
          name: App de prueba (Android)
          body: APK de depuración de La Percha. Instálalo en tu móvil para probar la última versión.
          prerelease: true
          files: app/build/app/outputs/flutter-apk/app-debug.apk
