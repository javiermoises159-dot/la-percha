#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#E0452C;color:#fff;z-index:9999;font-family:'Onest',system-ui,sans-serif;transition:opacity .35s;overflow:hidden}
#splash.hide{opacity:0;pointer-events:none}
#splash .col{display:flex;flex-direction:column;align-items:center;margin-top:-40px}
#splash .g{overflow:visible}
#splash .piso{width:230px;height:3px;border-radius:2px;background:#fff;margin-top:-3px;animation:fuera 0.28s 1.33s both}
@keyframes fuera{to{opacity:0;transform:scaleX(.4)}}
#splash .w{font-weight:800;font-size:46px;letter-spacing:-2px;margin-top:26px;height:56px}
#splash .w span{display:inline-block;animation:up 0.24s both}
#splash .t{font-size:15px;font-weight:600;margin-top:4px;color:#F5B731;animation:up 0.35s 1.82s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#splash .ave{transform-box:view-box;transform-origin:70px 118px;animation:sec 1.54s both}
@keyframes sec{0%{opacity:0;transform:translate(-230px,-300px) rotate(-25deg) scale(.5)}12%{opacity:1}
 40%{transform:none;animation-timing-function:ease-in-out}52%{transform:none;animation-timing-function:ease-in}
 63%{transform:rotate(-38deg)}70%{transform:rotate(-38deg);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}88%,100%{transform:none}}
#splash .ala{transform-box:fill-box;transform-origin:top left;animation:aleteo 0.13s 5 alternate ease-in-out}
@keyframes aleteo{to{transform:rotate(-30deg)}}
#splash .piso-tag{animation:coge 1.54s steps(1,end) both}
@keyframes coge{0%,69%{opacity:1}70%,100%{opacity:0}}
#splash .tag{transform-box:view-box;transform-origin:28px 79px;animation:aparece 1.54s steps(1,end) both,swing 0.98s 1.08s ease-out both}
@keyframes aparece{0%,69%{opacity:0}70%,100%{opacity:1}}
@keyframes swing{0%{transform:rotate(-30deg)}25%{transform:rotate(20deg)}50%{transform:rotate(-10deg)}75%{transform:rotate(4deg)}100%{transform:none}}
#splash .ojo{transform-box:fill-box;transform-origin:center;animation:blink 3s 1.82s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

#splash .t{color:#fff}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .piso,#splash .piso-tag{display:none}}

<script>
  (function () {
    var el = document.getElementById('splash'), pct = el.querySelector('.pct');
    var t0 = performance.now(), listo = false, fin = false, shown = 0;
    // La etiqueta avanza hasta 90 % por tiempo y solo marca 100 % cuando la app ya cargó.
    window.addEventListener('flutter-first-frame', function () { listo = true; });
    function hide() {
      if (fin) return; fin = true;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 400);
    }
    function loop(now) {
      if (fin) return;
      var s = (now - t0) / 1000, p = Math.max(0, Math.min(1, (s - 1.4) / 1.2));
      var meta = 90 * (1 - Math.pow(1 - p, 2));
      if (listo && s > 2.1) meta = 100;
      shown += (meta - shown) * (meta === 100 ? 0.35 : 1);
      var v = Math.round(shown);
      pct.textContent = v >= 100 ? '¡Listo!' : v + '%';
      if (v >= 100) { setTimeout(hide, 450); return; }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    setTimeout(hide, 15000);
  })();
</script>

<div id="ios-pasos"><div>
  <h3>Añade Pavito a tu inicio</h3>
  <ol><li>Toca el botón <b>Compartir</b> de Safari (el cuadro con la flecha hacia arriba).</li>
      <li>Elige <b>Añadir a pantalla de inicio</b>.</li>
      <li>Toca <b>Añadir</b>. ¡Listo, ya tienes la guacamaya en tu inicio!</li></ol>
  <button id="ios-ok">Entendido</button>
</div></div>
<script>
  (function () {
    var yaInstalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    var hoy = Date.now(), k = 'pv_instalar_no';
    var descartado = false;
    try { descartado = hoy - (+localStorage.getItem(k) || 0) < 7 * 864e5; } catch (e) {}
    if (yaInstalada || descartado) return;
    var ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua) && !/crios|fxios/i.test(ua);
    var aviso = document.getElementById('instalar'), pasos = document.getElementById('ios-pasos'), pedido = null;
    function mostrar() { if (!document.getElementById('splash')) aviso.style.display = 'flex'; else setTimeout(mostrar, 1500); }
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); pedido = e; setTimeout(mostrar, 6000); });
    if (ios) setTimeout(mostrar, 8000);
    document.getElementById('instalar-no').onclick = function () {
      aviso.style.display = 'none'; try { localStorage.setItem(k, String(hoy)); } catch (e) {}
    };
    document.getElementById('instalar-si').onclick = function () {
      if (pedido) { pedido.prompt(); pedido.userChoice.then(function () { aviso.style.display = 'none'; }); pedido = null; }
      else if (ios) { pasos.style.display = 'flex'; }
    };
    document.getElementById('ios-ok').onclick = function () { pasos.style.display = 'none'; aviso.style.display = 'none'; };
    window.addEventListener('appinstalled', function () { aviso.style.display = 'none'; });
  })();
</script>

<div id="cf-captcha" style="position:fixed;left:0;bottom:0;z-index:10000;display:none"></div>
<script>
  // Anti-bots: Cloudflare Turnstile en modo invisible. La app pide un token al entrar o registrarse.
  window.pavitoCaptcha = function (key) {
    return new Promise(function (resolve) {
      var listo = false;
      var caja = document.getElementById('cf-captcha');
      function quitar() {
        try { if (window._pvTid !== undefined) turnstile.remove(window._pvTid); } catch (e) {}
        window._pvTid = undefined; if (caja) caja.style.display = 'none';
      }
      function fin(t) { if (!listo) { listo = true; resolve(t || null); setTimeout(quitar, t ? 900 : 0); } }
      function pintar() {
        try {
          if (window._pvTid !== undefined) { try { turnstile.remove(window._pvTid); } catch (e) {} }
          if (caja) caja.style.display = 'block';
          window._pvTid = turnstile.render('#cf-captcha', { sitekey: key, callback: fin,
            'error-callback': function () { fin(null); }, 'timeout-callback': function () { fin(null); } });
        } catch (e) { fin(null); }
      }
      if (window.turnstile) pintar();
      else {
        var s = document.createElement('script');
        s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        s.async = true; s.onload = pintar; s.onerror = function () { fin(null); };
        document.head.appendChild(s);
      }
      setTimeout(function () { fin(null); }, 20000);
    });
  };
</script>
