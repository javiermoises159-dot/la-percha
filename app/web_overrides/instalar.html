<style>
#instalar{position:fixed;left:12px;right:12px;bottom:86px;z-index:9998;display:none;align-items:center;gap:12px;
  background:#fff;color:#161412;border:2px solid #161412;border-radius:18px;padding:12px 12px 12px 14px;
  box-shadow:0 14px 30px rgba(22,20,18,.2);font-family:'Onest',system-ui,sans-serif;max-width:460px;margin:0 auto}
#instalar img{width:44px;height:44px;border-radius:11px}
#instalar b{display:block;font-size:16px;font-weight:800}
#instalar span{display:block;font-size:13px;color:#77716B}
#instalar .si{margin-left:auto;background:#E0452C;color:#fff;border:0;border-radius:12px;padding:10px 14px;font:800 15px 'Onest',system-ui;cursor:pointer}
#instalar .no{background:none;border:0;color:#77716B;font-size:22px;padding:0 4px;cursor:pointer}
#ios-pasos{position:fixed;inset:0;z-index:9999;display:none;background:rgba(22,20,18,.55);align-items:flex-end}
#ios-pasos div{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:22px 22px 34px;font-family:'Onest',system-ui,sans-serif;color:#161412}
#ios-pasos h3{margin:0 0 10px;font-size:21px;font-weight:800}
#ios-pasos ol{margin:0 0 16px;padding-left:22px;line-height:1.7;font-size:16px}
#ios-pasos button{width:100%;background:#E0452C;color:#fff;border:0;border-radius:12px;padding:13px;font:800 16px 'Onest',system-ui}
</style>
<div id="instalar" role="dialog" aria-label="Instalar Pavito">
  <img src="icons/Icon-192.png" alt="">
  <div><b>Instala Pavito</b><span>Ábrela como una app, sin tienda</span></div>
  <button class="si" id="instalar-si">Instalar</button>
  <button class="no" id="instalar-no" aria-label="Ahora no">×</button>
</div>
<div id="ios-pasos"><div>
  <h3 id="pasos-titulo">Añade Pavito a tu inicio</h3>
  <ol id="pasos-lista"></ol>
  <button id="ios-ok">Entendido</button>
</div></div>
<script>
  (function () {
    // Sale cada vez que alguien entra desde el navegador, hasta que instala la app.
    // La × solo lo esconde durante esa visita.
    var k = 'pv_instalada';
    var yaInstalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    try { if (yaInstalada) localStorage.setItem(k, '1'); if (localStorage.getItem(k) === '1') yaInstalada = true; } catch (e) {}
    try { if (sessionStorage.getItem('pv_instalar_no') === '1') return; } catch (e) {}
    if (yaInstalada) return;
    var ua = navigator.userAgent;
    var ios = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && 'ontouchend' in document);
    var dentroDeApp = /instagram|fban|fbav|fb_iab|tiktok|musical_ly|bytedance|line\/|snapchat|twitter/i.test(ua);
    var android = /android/i.test(ua);
    var aviso = document.getElementById('instalar'), pasos = document.getElementById('ios-pasos'), pedido = null, mostrado = false;
    var titulo = document.getElementById('pasos-titulo'), lista = document.getElementById('pasos-lista');
    function mostrar() {
      if (mostrado) return;
      var cookies = null; try { cookies = localStorage.getItem('flutter.pv_cookies_v1'); } catch (e) { cookies = '1'; }
      // Espera a que se cierre el aviso de cookies para no taparlo.
      if (document.getElementById('splash') || !cookies) { setTimeout(mostrar, 1500); return; }
      mostrado = true; aviso.style.display = 'flex';
    }
    function verPasos(t, items) {
      titulo.textContent = t; lista.innerHTML = '';
      items.forEach(function (x) { var li = document.createElement('li'); li.innerHTML = x; lista.appendChild(li); });
      pasos.style.display = 'flex';
    }
    if (dentroDeApp) {
      aviso.querySelector('span').textContent = 'Ábrela en tu navegador para instalarla';
      aviso.querySelector('.si').textContent = 'Cómo';
    }
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); pedido = e; setTimeout(mostrar, 4000); });
    // Si el navegador no ofrece instalar solo (iPhone, Instagram, TikTok…), igual se muestra con instrucciones.
    setTimeout(mostrar, ios || dentroDeApp ? 5000 : 9000);
    document.getElementById('instalar-no').onclick = function () {
      aviso.style.display = 'none'; try { sessionStorage.setItem('pv_instalar_no', '1'); } catch (e) {}
    };
    document.getElementById('instalar-si').onclick = function () {
      if (dentroDeApp) {
        verPasos('Abre Pavito en tu navegador', ios
          ? ['Toca los <b>tres puntos (···)</b> arriba a la derecha.', 'Elige <b>Abrir en el navegador</b> (Safari).', 'Ahí toca <b>Instalar</b> en el aviso de abajo.']
          : ['Toca los <b>tres puntos (⋮)</b> arriba a la derecha.', 'Elige <b>Abrir en Chrome</b> (o en el navegador).', 'Ahí toca <b>Instalar</b> en el aviso de abajo.']);
      } else if (pedido) {
        pedido.prompt(); pedido.userChoice.then(function (r) { if (r && r.outcome === 'accepted') aviso.style.display = 'none'; }); pedido = null;
      } else if (ios) {
        verPasos('Añade Pavito a tu inicio', ['Toca el botón <b>Compartir</b> de Safari (el cuadro con la flecha hacia arriba).',
          'Elige <b>Añadir a pantalla de inicio</b>.', 'Toca <b>Añadir</b>. ¡Listo, ya tienes la guacamaya en tu inicio!']);
      } else {
        verPasos('Instala Pavito', [android ? 'Toca los <b>tres puntos (⋮)</b> del navegador, arriba a la derecha.' : 'Abre el menú del navegador.',
          'Elige <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.', 'Confirma. ¡Listo!']);
      }
    };
    document.getElementById('ios-ok').onclick = function () { pasos.style.display = 'none'; };
    window.addEventListener('appinstalled', function () {
      aviso.style.display = 'none'; try { localStorage.setItem(k, '1'); } catch (e) {}
    });
  })();
</script>
