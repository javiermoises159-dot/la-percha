<title>La Percha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna con barra de pestañas inferior; anuncios en cuadrícula (2 columnas en móvil); fichas y chat en una hoja deslizante. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#14201B; --muted:#56655E; --line:#D9E0D9; --chip:#E6EBE5;
  --accent:#C92A58; --accent-ink:#FFFFFF; --leaf:#17694A; --leaf-soft:#D9EFE3; --scrim:rgba(10,18,14,.55);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:1100px;margin:0 auto}

/* encabezado */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font:800 24px/1 var(--f-display);letter-spacing:-.02em}
.brand svg{width:30px;height:30px;flex:none}
.curwrap{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{padding:5px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rate{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;max-width:96px;text-align:left;line-height:1.2}
.search{display:flex;gap:8px;margin-top:12px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* contenido */
main{padding:6px 0 120px;min-height:60vh}
.note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.count{font-size:13px;color:var(--muted);margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px}
.card{position:relative;min-width:0}
.cardbtn{display:block;width:100%;text-align:left}
.pic{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:14px;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center}
.ph svg{width:54%;opacity:.9}
.heart{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink)}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.heart[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.heart.in{position:static;flex:none;background:var(--chip)}
.badges{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:75%}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--bg)}
.badge.ex{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.badge.sold{background:var(--accent);color:var(--accent-ink)}
.badge.hot{background:var(--leaf);color:var(--bg)}
.meta{padding:8px 2px 0}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0}
.p1{font:800 18px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.p2{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.price.big .p1{font-size:28px}
.price.big .p2{font-size:15px}
.ttl{margin:3px 0 0;font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{margin:2px 0 0;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:48px 8px;color:var(--muted)}
.empty h2{font:700 20px var(--f-display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 16px;max-width:34ch}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--accent)}
.tab.sell span.ic{display:grid;place-items:center;width:40px;height:28px;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
.tab.sell svg{stroke:var(--accent-ink);width:20px;height:20px}
.tab.sell{color:var(--ink)}

/* formulario */
.form{display:grid;gap:14px;max-width:560px}
.form h1{font:800 26px/1.1 var(--f-display);margin:0}
.field{display:grid;gap:5px}
.field label,.field .lbl{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;min-width:0}
.field textarea{min-height:92px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted)}
.photo{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;border:2px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);cursor:pointer;overflow:hidden;background:var(--surface)}
.photo img{width:100%;height:100%;object-fit:cover}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.checks input{width:auto;accent-color:var(--accent)}

/* hoja */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:560px;max-height:92dvh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font:700 18px var(--f-display)}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.xbtn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.pbody{padding:14px 16px;overflow-y:auto;flex:1;min-height:0}
.pfoot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg)}
.pfoot .btn{flex:1}
.pfoot form{display:flex;gap:8px;width:100%}
.pfoot input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.pfoot form .btn{flex:none}
.dimg .pic{aspect-ratio:4/5;max-height:50vh;margin:0 auto}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:14px 0 6px}
.dhead h3{margin:0;font:700 22px/1.2 var(--f-display);text-wrap:balance}
.facts{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.facts span{display:block;font-size:12px;color:var(--muted)}
.facts b{font-weight:700;overflow-wrap:anywhere}
.desc{margin:0 0 14px;overflow-wrap:anywhere}
.sheet h4{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:5px 12px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:600}
.tag.ok{background:var(--leaf-soft);color:var(--leaf)}
.seller{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seller small{display:block;color:var(--muted)}
.buy{margin-top:16px;padding:14px;border:1px solid var(--accent);border-radius:14px;display:grid;gap:10px;background:var(--surface)}
.buy legend{font-weight:700;padding:0}
.buy fieldset{border:0;padding:0;margin:0;display:grid;gap:6px}
.buy label{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--chip)}
.buy input{accent-color:var(--accent)}
.msgs{display:grid;gap:8px;align-content:start}
.bub{max-width:82%;padding:9px 13px;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.bub.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bub small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.thr{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.thr b{display:block}
.thr span{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thr small{color:var(--muted);font-size:12px}
.sum{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum span{color:var(--muted)}
.sum b{font-variant-numeric:tabular-nums;text-align:right}
.sum .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.sum .tot span{color:var(--ink)}
.steps{list-style:none;margin:14px 0;padding:0;display:grid;gap:10px}
.steps li{display:flex;flex-direction:column;padding-left:28px;position:relative;color:var(--muted)}
.steps li::before{content:"";position:absolute;left:4px;top:3px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--leaf);border-color:var(--leaf)}
.steps small{color:var(--muted);font-size:12px}
.st{font-style:normal;font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink)}
.st.ok{background:var(--leaf-soft);color:var(--leaf)}
.st.bad{background:var(--accent);color:var(--accent-ink)}
.stars{display:flex;gap:6px}
.stars button{font-size:32px;line-height:1;color:var(--muted);opacity:.45}
.stars button[aria-pressed="true"]{color:var(--accent);opacity:1}
.tab{position:relative}
.tab .dot{position:absolute;top:4px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--ink);font:700 18px var(--f-display);object-fit:cover;flex:none}
.av.big{width:64px;height:64px;font-size:28px}
.pro{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.pro h1{margin:0;font:800 24px/1.1 var(--f-display);overflow-wrap:anywhere}
.menu{display:grid;gap:8px;margin-top:12px}
.menurow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.menurow span{flex:1;min-width:0}
.menurow em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.menurow i{font-style:normal;color:var(--muted);font-size:20px;line-height:1}
.buy .menurow{background:var(--chip);border:0}
.subhead{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.subhead h1{margin:0;font:800 22px var(--f-display)}
.trust{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px 14px;border-radius:12px;background:var(--leaf-soft);color:var(--leaf);margin:0 0 12px}
.trust b{font-weight:700}
.trust span{font-size:13px}
.mine{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.mthumb{flex:none;width:76px;height:96px;border-radius:10px;overflow:hidden;background:var(--chip)}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.minfo{min-width:0;flex:1;display:grid;gap:3px;align-content:start}
.minfo b{overflow-wrap:anywhere}
.minfo span{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.minfo small{color:var(--muted)}
.macts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
button.seller{width:100%;text-align:left;justify-content:space-between}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;gap:2px}
.rev .rs{color:var(--accent);letter-spacing:2px}
.rev small{color:var(--muted)}
.welcome{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.welcome[hidden]{display:none}
.wbox{width:100%;max-width:420px;margin:auto;display:grid;gap:20px}
.wlogo{display:flex;align-items:center;gap:12px;font:800 28px/1 var(--f-display);letter-spacing:-.02em}
.wlogo svg{width:56px;height:56px;flex:none}
.wbox h1{margin:0;font:800 clamp(32px,9vw,44px)/1.02 var(--f-display);letter-spacing:-.03em;text-wrap:balance}
.wbox .lead{margin:0;font-size:18px;color:var(--muted)}
.wins{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.wins li{display:flex;gap:12px;align-items:flex-start}
.wins li::before{content:"✓";flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-weight:800;font-size:13px}
.wins b{display:block}
.wins span{color:var(--muted);font-size:14px}
.wact{display:grid;gap:10px}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;font-weight:600}
.legal h4{margin:14px 0 6px}
.legal p,.legal li{font-size:14px;margin:0 0 6px}
@media (prefers-reduced-motion:no-preference){
  .wlogo svg{animation:pop .7s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:calc(100vw - 32px);font-weight:600;font-size:14px}
.toast[hidden]{display:none}
@media (min-width:700px){
  .sheet{align-items:center}
  .panel{border-radius:20px;max-height:86dvh}
}
@media (prefers-reduced-motion:no-preference){
  .panel{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="lg" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="13" style="fill:var(--accent)"/>
    <g style="fill:none;stroke:var(--accent-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 17.5a3.6 3.6 0 1 0-3.6-3.6"/>
      <path d="M24 17.5v3M24 20.5 10.5 30.4a1.7 1.7 0 0 0 1 3.1h25a1.7 1.7 0 0 0 1-3.1L24 20.5Z"/>
    </g>
  </symbol>
</svg>
<div class="shell">
  <header class="sticky" id="hdr">
    <div class="top">
      <div class="brand">
        <svg aria-hidden="true"><use href="#lg"/></svg>
        <span>La Percha</span>
      </div>
      <div class="curwrap">
        <div class="seg" role="group" aria-label="Moneda">
          <button data-a="cur" data-v="USD" aria-pressed="true">USD</button>
          <button data-a="cur" data-v="VES" aria-pressed="false">Bs</button>
        </div>
        <button class="rate" data-a="rate" id="rateBtn"></button>
      </div>
    </div>
    <div id="searchBlock">
      <div class="search">
        <input id="q" type="search" placeholder="Busca jeans, vestidos, zapatos…" aria-label="Buscar ropa" autocomplete="off">
        <button class="btn" data-a="filters" id="fBtn">Filtros</button>
      </div>
      <div class="cats" id="cats" role="group" aria-label="Categorías"></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button class="tab" data-a="tab" data-v="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Explorar</button>
    <button class="tab" data-a="tab" data-v="favs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg>Favoritos</button>
    <button class="tab sell" data-a="tab" data-v="sell"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Vender</button>
    <button class="tab" data-a="tab" data-v="msgs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h15v10h-8l-4.5 3.5v-3.5h-2.5Z"/></svg>Mensajes</button>
    <button class="tab" data-a="tab" data-v="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-4 4-6 7.5-6s6.7 2 7.5 6"/></svg>Perfil<i class="dot" id="profDot" hidden></i></button>
  </div>
</nav>

<div class="welcome" id="welcome" hidden>
  <div class="wbox">
    <div class="wlogo"><svg aria-hidden="true"><use href="#lg"/></svg><span>La Percha</span></div>
    <h1>Dale otra vida a tu ropa</h1>
    <p class="lead">Compra y vende ropa usada en toda Venezuela.</p>
    <ul class="wins">
      <li><div><b>Pagas protegido</b><span>Tu dinero espera hasta que recibes la prenda.</span></div></li>
      <li><div><b>Vendes sin comisión</b><span>Cobras el precio completo de cada prenda.</span></div></li>
      <li><div><b>Envíos a todo el país</b><span>MRW, Zoom, Tealca o entrega en persona.</span></div></li>
    </ul>
    <div class="wact">
      <button class="btn primary block" data-a="w-register">Crear cuenta</button>
      <button class="btn block" data-a="w-login">Ya tengo cuenta</button>
      <button class="linkbtn" data-a="w-guest">Explorar sin cuenta</button>
    </div>

</div>

var REPLIES=["¡Hola! Sí, sigue disponible.","Te lo puedo entregar en persona esta semana. ¿En qué zona estás?","También lo puedo enviar por MRW o Tealca. ¿Desde qué ciudad me escribes?","Perfecto, te aparto la prenda. Dime cuándo te queda bien."];

  ex(8,{title:"Short deportivo negro",price:6,cat:"pantalones",size:"M",cond:"Nuevo con etiqueta",brand:"Nike",city:"Caracas",desc:"Nunca lo usé, me quedó pequeño.",ship:["persona","zoom"]})
];

var S={tab:"home",cat:"todo",q:"",f:{size:"",cond:"",city:"",max:"",sort:"new",hideSold:true},cur:"USD",rate:400,
  real:[],favs:[],threads:new Map(),local:new Map(),orders:new Map(),localOrders:new Map(),db:null,user:null,uid:null,live:false,ready:false,
  sheet:null,buy:false,confirmDel:null,draftImg:null,opener:null,sub:"",me:null,seen:{},pendRate:{},pendTxt:{},editId:null,acct:null,auth:{mode:"register",step:1,msg:"",d:{}},back:null};

/* ---------- utilidades ---------- */
function fee(p){return Math.round((FEE_FIXED+p*FEE_PCT)*100)/100}
function usd(n){return "$"+(Number.isInteger(n)?n:n.toFixed(2))}
function bs(n){return "Bs "+Math.round(n*S.rate).toLocaleString("es-VE")}
function priceHTML(n,big){var a=S.cur==="USD"?usd(n):bs(n),b=S.cur==="USD"?bs(n):usd(n);return '<p class="price'+(big?' big':'')+'"><span class="p1">'+a+'</span><span class="p2">'+b+'</span></p>'}
function lab(list,k){for(var i=0;i<list.length;i++)if(list[i][0]===k)return list[i][1];return ""}

var tt;
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3200)}
function when(ts){try{return new Date(ts).toLocaleString("es-VE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function tintOf(l){var t=TINTS[(typeof l.tint==="number"?l.tint:0)%TINTS.length];return t}
function pic(l){
  var inner;

  else{var t=tintOf(l);inner='<div class="ph" style="background:'+t[0]+';color:'+t[1]+'"><svg viewBox="0 0 100 120" aria-hidden="true">'+(SHAPES[l.cat]||SHAPES.tops)+'</svg></div>'}
  var bg=(isHot(l)?'<span class="badge hot">Destacado</span>':'')+(l.ex?'<span class="badge ex">Ejemplo</span>':'')+(l.sold?'<span class="badge sold">Vendido</span>':'');
  return '<div class="pic">'+inner+(bg?'<div class="badges">'+bg+'</div>':'')+'</div>'
}

/* ---------- filtros y listado ---------- */
function visible(){
  var q=S.q.trim().toLowerCase(),f=S.f;
  var a=base().filter(function(l){
    return (S.cat==="todo"||l.cat===S.cat)&&(!q||((l.title||"")+" "+(l.brand||"")).toLowerCase().indexOf(q)>=0)
      &&(!f.size||l.size===f.size)&&(!f.cond||l.cond===f.cond)&&(!f.city||l.city===f.city)&&(!f.max||l.price<=+f.max)&&(!f.hideSold||!l.sold)});
  if(f.sort==="low")a.sort(function(x,y){return x.price-y.price});
  else if(f.sort==="high")a.sort(function(x,y){return y.price-x.price});
  else a.sort(function(x,y){return ((isHot(y)?1:0)-(isHot(x)?1:0))||((y.ts||0)-(x.ts||0))});
  return a
}

    '<button class="heart" data-a="fav" data-id="'+esc(l.id)+'" aria-pressed="'+fav+'" aria-label="Guardar en favoritos">'+HEART+'</button></article>'

function renderCats(){

}
function renderView(){

    var a=visible();
    h=trustHTML()+noteHTML()+'<p class="count">'+plural(a.length)+(S.cat!=="todo"?' en '+esc(catName(S.cat)):'')+'</p>'+
      (a.length?grid(a):'<div class="empty"><h2>Nada por aquí todavía</h2><p>Prueba con otra categoría, quita algún filtro o publica tú la prenda que buscas vender.</p><button class="btn primary" data-a="tab" data-v="sell">Vender una prenda</button></div>')
  }else if(S.tab==="favs"){
    var f=base().filter(function(l){return S.favs.indexOf(l.id)>=0});
    h=f.length?'<p class="count">'+plural(f.length)+' guardados</p>'+grid(f):'<div class="empty"><h2>Aún no guardas nada</h2><p>Toca el corazón en un anuncio para tenerlo a mano aquí.</p><button class="btn primary" data-a="tab" data-v="home">Ver anuncios</button></div>'
  }else if(S.tab==="profile"){
    h=profileHTML()
  }else if(S.tab==="msgs"){
    h=threadsHTML()

function threadsHTML(){
  var all=new Map();
  S.local.forEach(function(t,k){if(t.msgs&&t.msgs.length)all.set(k,t)});
  S.threads.forEach(function(t,k){all.set(k,t)});
  var a=Array.from(all.values()).sort(function(x,y){return (y.ts||0)-(x.ts||0)});
  if(!a.length)return '<div class="empty"><h2>Sin mensajes</h2><p>Cuando escribas a un vendedor, o alguien te escriba por una prenda tuya, la conversación aparece aquí.</p><button class="btn primary" data-a="tab" data-v="home">Buscar ropa</button></div>';

    var soy=t.sellerId===myKey()&&myKey()!=="me";
    return '<button class="thr" data-a="thread" data-id="'+esc(t.id)+'"><small>'+(soy?"Interesado/a en tu prenda":"Hablas con el vendedor")+' · '+esc(when(t.ts))+'</small><b>'+esc(t.title)+'</b><span>'+esc(t.last||"")+'</span></button>'
  }).join("")
}
function sellHTML(){
  var e=S.editId?find(S.editId):null;if(S.editId&&!e)S.editId=null;
  var v=function(k){return e&&e[k]!=null?esc(e[k]):""};
  var cats=CATS.slice(1).map(function(c){return '<option value="'+c[0]+'"'+(e&&e.cat===c[0]?" selected":"")+'>'+c[1]+'</option>'}).join("");
  var conds=COND.map(function(c){return '<option'+(e&&e.cond===c?" selected":"")+'>'+c+'</option>'}).join("");
  var shipSel=e&&e.ship?e.ship:["persona"],paySel=e&&e.pay?e.pay:["pagomovil","efectivo"];
  var ships=SHIP.map(function(c){return '<label><input type="checkbox" name="ship" value="'+c[0]+'"'+(shipSel.indexOf(c[0])>=0?" checked":"")+'>'+c[1]+'</label>'}).join("");
  var pays=PAY.map(function(c){return '<label><input type="checkbox" name="pay" value="'+c[0]+'"'+(paySel.indexOf(c[0])>=0?" checked":"")+'>'+c[1]+'</label>'}).join("");
  return '<form class="form" id="sellForm" novalidate><h1>'+(e?'Editar anuncio':'Vende una prenda')+'</h1>'+
    '<div class="field"><span class="lbl">Foto</span><label class="photo" for="f-photo" id="photoPrev">'+(S.draftImg?'<img src="'+S.draftImg+'" alt="Vista previa">':'<span>Toca para añadir una foto<br><small>Con buena luz y la prenda extendida se vende más rápido</small></span>')+'</label><input class="sr" type="file" id="f-photo" accept="image/*"></div>'+
    '<div class="field"><label for="f-title">Título</label><input id="f-title" maxlength="70" value="'+v("title")+'" placeholder="Ej. Jeans Levi\'s 501 talla 32" autocomplete="off"></div>'+

    '<div class="field"><label for="f-cat">Categoría</label><select id="f-cat">'+cats+'</select></div></div>'+
    '<div class="row2"><div class="field"><label for="f-size">Talla</label><input id="f-size" list="sizes" value="'+v("size")+'" placeholder="M, 32, 40…" maxlength="8" autocomplete="off"><datalist id="sizes">'+SIZES.map(function(x){return '<option value="'+x+'">'}).join("")+'</datalist></div>'+
    '<div class="field"><label for="f-cond">Estado</label><select id="f-cond">'+conds+'</select></div></div>'+
    '<div class="row2"><div class="field"><label for="f-brand">Marca (opcional)</label><input id="f-brand" maxlength="30" value="'+v("brand")+'" autocomplete="off"></div>'+

    '<div class="field"><label for="f-desc">Descripción</label><textarea id="f-desc" maxlength="500" placeholder="Medidas, detalles, por qué la vendes…">'+v("desc")+'</textarea></div>'+

    '<p class="hint" id="formErr" role="alert" style="color:var(--accent)"></p>'+
    '<button class="btn primary block" type="submit">'+(e?'Guardar cambios':'Publicar anuncio')+'</button>'+
    (e?'<button class="btn block" type="button" data-a="cancel-edit">Cancelar</button>':'')+'</form>'
}
function refresh(){
  renderCats();renderChrome();
  if(S.tab!=="sell"&&!(S.tab==="profile"&&(S.sub==="ship"||S.sub==="settings")))renderView();
  renderChrome();

/* ---------- hoja (detalle, chat, filtros, tasa) ---------- */
function openSheet(cfg){
  S.opener=document.activeElement;S.sheet=cfg;S.buy=false;S.confirmDel=null;
  renderSheet();
  document.documentElement.style.overflow="hidden";
  $("#xbtn").focus()
}
function closeSheet(){
  S.sheet=null;$("#sheet").hidden=true;document.documentElement.style.overflow="";
  if(S.opener&&S.opener.focus&&document.contains(S.opener))try{S.opener.focus()}catch(e){}
}
function renderSheet(){
  var s=S.sheet;if(!s)return;
  var title="",body="",foot="";
  if(s.t==="detail"){var l=find(s.id);if(!l){closeSheet();return}var d=detail(l);title="Anuncio";body=d.body;foot=d.foot}
  else if(s.t==="chat"){var t=getThread(s.id);if(!t){closeSheet();return}title=t.title;body='<div id="offerBox"></div><div class="msgs" id="msgs"></div>';foot='<form id="chatForm"><input id="chatIn" maxlength="500" placeholder="Escribe un mensaje" autocomplete="off" aria-label="Mensaje"><button class="btn primary" type="submit">Enviar</button></form>'}
  else if(s.t==="filters"){title="Filtros";body=filtersHTML();foot='<button class="btn" data-a="resetf">Limpiar</button><button class="btn primary" data-a="applyf">Ver resultados</button>'}
  else if(s.t==="order"){var o=getOrder(s.id);if(!o){closeSheet();return}title="Pedido";body=orderBody(o);foot=""}
  else if(s.t==="auth"){title=S.auth.mode==="login"?"Iniciar sesión":"Crea tu cuenta";body=authHTML();foot=""}
  else if(s.t==="terms"){title="Términos y privacidad";body=termsHTML();foot='<button class="btn primary" data-a="close">Cerrar</button>'}
  else if(s.t==="seller"){title="Vendedor";body=sellerBody(s);foot=""}
  else if(s.t==="help"){title="Cómo funciona";body=helpHTML();foot='<button class="btn primary" data-a="close">Entendido</button>'}
  else if(s.t==="rate"){title="Tasa de cambio";body='<div class="field"><label for="rateIn">Bolívares por 1 US$</label><input id="rateIn" type="number" inputmode="decimal" min="1" step="0.01" value="'+S.rate+'"></div><p class="hint">El 400 inicial es un valor de ejemplo. Escribe la tasa del día para que los precios en Bs sean correctos.</p>';foot='<button class="btn primary" data-a="saverate">Guardar tasa</button>'}
  $("#ptitle").textContent=title;$("#pbody").innerHTML=body;
  var pf=$("#pfoot");pf.innerHTML=foot;pf.hidden=!foot;$("#sheet").hidden=false;
  if(s.t==="chat")updateChat();
  if(s.t==="detail")fillSeller(find(s.id));
  if(s.t==="seller")fillSellerProfile(s)
}
function detail(l){
  var mine=!!S.uid&&l.sellerId===S.uid,fav=S.favs.indexOf(l.id)>=0;
  var ships=(l.ship||[]).map(function(k){return lab(SHIP,k)}).filter(Boolean);
  var pays=(l.pay||["pagomovil","efectivo"]).map(function(k){return lab(PAY,k)}).filter(Boolean);
  var good=l.cond==="Nuevo con etiqueta"||l.cond==="Como nuevo";
  var body='<div class="dimg">'+pic(l)+'</div>'+
    '<div class="dhead"><h3>'+esc(l.title)+'</h3><button class="heart in" data-a="fav" data-id="'+esc(l.id)+'" aria-pressed="'+fav+'" aria-label="Guardar en favoritos">'+HEART+'</button></div>'+
    priceHTML(l.price,true)+
    '<ul class="facts"><li><span>Talla</span><b>'+esc(l.size)+'</b></li><li><span>Estado</span><b>'+esc(l.cond)+'</b></li><li><span>Marca</span><b>'+esc(l.brand||"Sin marca")+'</b></li><li><span>Ciudad</span><b>'+esc(l.city)+'</b></li></ul>'+
    '<p class="desc">'+esc(l.desc||"Sin descripción.")+'</p>'+
    '<button class="seller" data-a="seller" data-id="'+esc(l.sellerId||"")+'" data-l="'+esc(l.id)+'"><div><b id="sName">Vendedor/a</b><small>'+esc(l.city)+'</small><small id="sRate"></small></div><span aria-hidden="true">›</span></button>'+
    '<h4>Entrega</h4><div class="tags">'+(ships.length?ships.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join(""):'<span class="tag">A convenir</span>')+'</div>'+
    '<h4>Pagos aceptados</h4><div class="tags">'+pays.map(function(x){return '<span class="tag'+(good?'':'')+'">'+esc(x)+'</span>'}).join("")+'</div>'+
    (S.buy?buyPanel(l):"");
  var foot;
  if(mine){
    foot=(l.sold?'':'<button class="btn" data-a="sold" data-id="'+esc(l.id)+'">Marcar vendido</button>')+

async function sendMsg(id,text,off){
  text=(text||"").trim();if(!text)return false;
  var t=getThread(id);if(!t)return false;
  var m={from:myKey(),text:text.slice(0,500),ts:Date.now()};
  var msgs=(t.msgs||[]).concat([m]).slice(-60);
  var offer=off===undefined?(t.offer||null):off;
  if(!t.local){
    try{
      await S.db.doc("threads/"+t.id).set({listingId:t.listingId,title:t.title,sellerId:t.sellerId,buyerId:t.buyerId,msgs:msgs,ts:m.ts,last:m.text.slice(0,80),offer:offer});
    }catch(e){toast("No se pudo enviar el mensaje");return false}
    var cur=S.threads.get(id)||t;
    S.threads.set(id,Object.assign({},cur,{id:id,msgs:msgs,ts:m.ts,last:m.text.slice(0,80),offer:offer}))
  }else{
    t.msgs=msgs;t.ts=m.ts;t.last=m.text.slice(0,80);t.offer=offer
  }
  updateChat();if(S.tab==="msgs")renderView();
  if(t.local&&t.demo){
    var n=msgs.length;
    setTimeout(function(){
      var tt2=getThread(id);if(!tt2)return;
      var r;
      if(off&&off.by==="buyer"&&off.status==="pendiente"){
        var l=find(tt2.listingId),p=l?l.price:off.amount,am=off.amount;
        if(am>=p*0.85)r={text:"¡Trato hecho! Acepto tu oferta de "+usd(am)+".",offer:{amount:am,by:"buyer",status:"aceptada"}};
        else if(am>=p*0.6){var c=Math.round(p*0.92*2)/2;r={text:"Gracias por la oferta. Te lo dejo en "+usd(c)+".",offer:{amount:c,by:"seller",status:"pendiente"}}}
        else r={text:"Está muy por debajo del precio, no puedo aceptarla.",offer:{amount:am,by:"buyer",status:"rechazada"}}
      }else if(off&&off.status==="aceptada")r={text:"¡Perfecto! Quedo atento al pago."};
      else if(off&&off.status==="rechazada")r={text:"Entendido. Si cambias de idea, avísame."};
      else if(off===undefined)r={text:REPLIES[Math.min(Math.floor(n/2),REPLIES.length-1)]};
      else return;
      var ts=Date.now();
      tt2.msgs=(tt2.msgs||[]).concat([{from:"demo",text:r.text,ts:ts}]);tt2.ts=ts;tt2.last=r.text.slice(0,80);
      if(r.offer)tt2.offer=r.offer;
      updateChat();if(S.tab==="msgs")renderView()
    },1300)
  }
  return true
}

  var tel=val("a-tel");
  if(a.mode==="register"){
    var tk=$("#a-terms");
    a.d={u:val("a-user"),t:tel,c:val("a-city"),k:!!(tk&&tk.checked)};
    if(a.d.u.length<3||a.d.u.length>20){a.msg="El nombre de usuario debe tener entre 3 y 20 caracteres.";renderSheet();return}
    if(!validTel(tel)){a.msg="Escribe un móvil venezolano, por ejemplo 0414-1234567.";renderSheet();return}
    if(!a.d.c){a.msg="Indica tu ciudad.";renderSheet();return}
    if(!a.d.k){a.msg="Acepta los términos para continuar.";renderSheet();return}
  }else{
    a.d={t:tel};
    if(!validTel(tel)){a.msg="Escribe un móvil venezolano, por ejemplo 0414-1234567.";renderSheet();return}
    var st=null;try{st=JSON.parse(localStorage.getItem("lp_acct")||"null")}catch(e){}
    if(!st||digits(st.t)!==digits(tel)){a.msg="No encontramos una cuenta con ese teléfono en este dispositivo. Crea una cuenta nueva.";renderSheet();return}
    a.d={t:tel,u:st.u,c:st.c}
  }
  a.step=2;a.msg="";renderSheet()
}
function authVerify(){
  var a=S.auth,code=($("#a-code")||{}).value||"";
  if(code.trim()!=="123456"){a.msg="El código no coincide. En la prueba es 123456.";renderSheet();return}
  S.acct={u:a.d.u,t:a.d.t,c:a.d.c,ts:Date.now()};
  saveAcct();
  var w=$("#welcome");if(w)w.hidden=true;
  var back=S.back;S.back=null;
  toast("¡Bienvenido/a, "+S.acct.u+"!");
  if(back){S.sheet=back;renderSheet()}else closeSheet();
  refresh()
}

/* ---------- perfil, vendedor y ayuda ---------- */
function isHot(l){return !!(l&&l.boost&&Date.now()-l.boost<7*864e5)}
function fm(n){return S.cur==="USD"?usd(n):bs(n)}
function myName(){return (S.acct&&S.acct.u)||(S.me&&S.me.name)||"Tu perfil"}
function avatar(name,url,big){
  if(url)return '<img class="av'+(big?' big':'')+'" src="'+esc(url)+'" alt="">';
  var ini=((name||"?").trim().charAt(0)||"?").toUpperCase();
  return '<span class="av'+(big?' big':'')+'" aria-hidden="true">'+esc(ini)+'</span>'
}
function myListings(){return base().filter(function(l){return l.sellerId===myKey()&&!l.ex})}
function myOrders(role){return allOrders().filter(function(o){return role==="seller"?o.sellerId===myKey():o.buyerId===myKey()})}
function pendingActions(){
  var a=[],me=myKey();
  allOrders().forEach(function(o){
    if(o.buyerId===me){
      if(o.status==="esperando_pago")a.push({id:o.id,t:"Paga «"+o.title+"» con Pago Móvil"});
      else if(o.status==="enviado")a.push({id:o.id,t:"¿Ya llegó «"+o.title+"»? Confirma la entrega"});
      else if(o.status==="liberado"&&!(o.rating>0))a.push({id:o.id,t:"Deja tu reseña de «"+o.title+"»"})
    }
    if(o.sellerId===me&&o.status==="retenido")a.push({id:o.id,t:"Envía «"+o.title+"»: el pago ya está retenido"})
  });
  return a
}

function fillSellerProfile(s){
  var sid=s.id,l=find(s.l)||{},set=function(id,h){var e=$("#"+id);if(e)e.innerHTML=h};
  var cnt=function(n){return n+(n===1?" venta":" ventas")};
  var list=base().filter(function(x){return x.sellerId===sid&&!x.sold});
  set("spList",list.length?grid(list):'<p class="hint">No tiene anuncios activos.</p>');
  if(l.ex){
    var i=parseInt(String(l.id).replace("ex",""),10)||1,R=[4.9,4.7,4.8,4.6,5,4.8,4.7,4.9];
    set("spName","Vendedor de ejemplo");
    set("spRate","★ "+String(R[(i-1)%R.length]).replace(".",",")+" · "+cnt(5+i*3)+" (ejemplo)");
    set("spRevs",revsHTML([{rating:5,comment:"Todo llegó como en la foto. Muy amable."},{rating:5,comment:"Respondió rápido y envió el mismo día."},{rating:4,comment:"La prenda estaba muy bien, tardó un poco en llegar."}],true));
    return
  }
  if(S.uid&&sid===S.uid)set("spName",esc(myName()));
  else if(l.sellerName){set("spName",esc(l.sellerName));set("spAv",esc(l.sellerName.charAt(0).toUpperCase()))}
  else if(S.user&&S.user.profiles){
    S.user.profiles([sid]).then(function(p){var n=p&&p[sid]&&p[sid].name;if(n){set("spName",esc(n));set("spAv",esc(n.charAt(0).toUpperCase()))}}).catch(function(){})
  }
  if(S.live&&sid&&sid!=="me"){
    S.db.collection("orders").where("sellerId","==",sid).get().then(function(sn){
      var rv=[],done=0,sum=0;
      sn.docs.forEach(function(d){var o=d.data();if(o.status==="liberado"){done++;if(o.rating>0){sum+=o.rating;rv.push(o)}}});
      rv.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
      set("spRate",rv.length?"★ "+(sum/rv.length).toFixed(1).replace(".",",")+" · "+cnt(done):(done?cnt(done)+" · sin reseñas":"Aún sin ventas"));
      set("spRevs",revsHTML(rv.slice(0,10)))
    }).catch(function(){set("spRevs",'<p class="hint">No se pudieron cargar las reseñas.</p>')})
  }else{set("spRate","Aún sin ventas");set("spRevs",'<p class="hint">Todavía no hay reseñas.</p>')}
}
function countView(id){
  var l=find(id);if(!l||l.ex||S.seen[id]||!S.live||l.sellerId===S.uid)return;
  S.seen[id]=1;S.db.doc("listings/"+id).update({views:(l.views||0)+1}).catch(function(){})
}

/* ---------- acciones ---------- */
var favChain=Promise.resolve();
function toggleFav(id){
  var i=S.favs.indexOf(id);
  S.favs=i>=0?S.favs.filter(function(x){return x!==id}):S.favs.concat([id]);
  var on=S.favs.indexOf(id)>=0,bs2=document.querySelectorAll('[data-a="fav"]');
  for(var k=0;k<bs2.length;k++)if(bs2[k].dataset.id===id)bs2[k].setAttribute("aria-pressed",String(on));
  if(S.tab==="favs")renderView();
  if(S.live){var favs=S.favs.slice();favChain=favChain.then(function(){return S.db.doc("data/users/"+S.uid+"/profile").set({favs:favs,acct:S.acct||null})}).catch(function(){toast("No se pudo guardar el favorito")})}
}
function setTab(t){S.tab=t;if(t!=="sell")S.draftImg=S.draftImg;renderChrome();renderView();window.scrollTo(0,0)}
function readImg(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=rej;
    fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
      var M=720,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.src=fr.result};
    fr.readAsDataURL(file)
  })
}
async function listingUpdate(id,patch){
  var l=find(id);if(!l)return false;
  try{if(S.live)await S.db.doc("listings/"+id).update(patch);else Object.assign(l,patch)}
  catch(e){toast("No se pudo guardar el cambio");return false}
  refresh();return true
}
async function publish(){
  var g=function(id){return $("#"+id).value.trim()};
  var err=$("#formErr"),title=g("f-title"),price=parseFloat($("#f-price").value),size=g("f-size"),city=g("f-city");
  if(!title){err.textContent="Escribe un título para tu anuncio.";$("#f-title").focus();return}
  if(!(price>0)){err.textContent="Escribe un precio en USD mayor que cero.";$("#f-price").focus();return}
  if(!size){err.textContent="Indica la talla.";$("#f-size").focus();return}
  if(!city){err.textContent="Indica tu ciudad.";$("#f-city").focus();return}
  var chk=function(n){return Array.from(document.querySelectorAll('input[name="'+n+'"]:checked')).map(function(x){return x.value})};
  var fields={title:title,price:Math.round(price*100)/100,cat:$("#f-cat").value,size:size,cond:$("#f-cond").value,brand:g("f-brand"),city:city,desc:g("f-desc"),img:S.draftImg||null,ship:chk("ship"),pay:chk("pay").length?chk("pay"):["efectivo"]};
  err.textContent="";
  var btn=document.querySelector("#sellForm button[type=submit]");btn.disabled=true;
  if(S.editId){
    var ok=await listingUpdate(S.editId,fields);
    if(!ok){btn.disabled=false;err.textContent="No se pudieron guardar los cambios.";return}
    S.editId=null;S.draftImg=null;toast("Cambios guardados");goSub("mine");return
  }
  var doc=Object.assign({tint:Math.floor(Math.random()*TINTS.length),sellerId:S.uid||"me",ts:Date.now(),sold:false,views:0,sellerName:(S.acct&&S.acct.u)||""},fields);
  try{
    if(S.live){await S.db.collection("listings").add(doc)}
    else{doc.id="loc"+Date.now();S.real=[doc].concat(S.real.filter(function(l){return !l.ex}))}
  }catch(e){
    btn.disabled=false;
    err.textContent=(e&&e.code==="quota_exceeded")?"La base de datos está llena. Elimina algún anuncio e inténtalo de nuevo.":"No se pudo publicar. Si compartiste la página, pide acceso de colaborador para publicar.";
    return
  }
  S.draftImg=null;S.cat="todo";S.q="";$("#q").value="";
  toast("Anuncio publicado");setTab("home");renderCats()
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,id=b.dataset.id;
  if(a==="tab"){var tv=b.dataset.v;if(S.editId&&tv!=="sell"){S.editId=null;S.draftImg=null}if(tv==="profile")S.sub="";if(tv==="sell"&&needAcct("Crea tu cuenta para vender tus prendas."))return;S.confirmDel=null;setTab(tv)}
  else if(a==="cur"){S.cur=b.dataset.v;try{localStorage.setItem("lp_cur",S.cur)}catch(x){}renderChrome();renderView();if(S.sheet&&S.sheet.t==="detail")renderSheet()}
  else if(a==="rate"){openSheet({t:"rate"})}
  else if(a==="saverate"){var v=parseFloat($("#rateIn").value);if(!(v>0)){toast("Escribe una tasa mayor que cero");return}S.rate=v;try{localStorage.setItem("lp_rate",String(v))}catch(x){}closeSheet();renderChrome();renderView()}
  else if(a==="cat"){S.cat=b.dataset.v;renderCats();renderView()}
  else if(a==="filters"){openSheet({t:"filters"})}
  else if(a==="applyf"){S.f={size:$("#x-size").value,cond:$("#x-cond").value,city:$("#x-city").value,max:$("#x-max").value,sort:$("#x-sort").value,hideSold:!$("#x-sold").checked};closeSheet();renderCats();renderView()}
  else if(a==="resetf"){S.f={size:"",cond:"",city:"",max:"",sort:"new",hideSold:true};closeSheet();renderCats();renderView()}
  else if(a==="open"){openSheet({t:"detail",id:id});countView(id)}
  else if(a==="close"){closeSheet()}
  else if(a==="fav"){toggleFav(id)}
  else if(a==="buy"){S.buy=!S.buy;renderSheet();if(S.buy){var bx=$("#buyBox");if(bx)bx.scrollIntoView({block:"center"})}}
  else if(a==="chat"){if(needAcct("Crea tu cuenta para escribir a los vendedores."))return;openChat(find(id))}
  else if(a==="thread"){S.opener=document.activeElement;S.sheet={t:"chat",id:id};renderSheet();document.documentElement.style.overflow="hidden";$("#xbtn").focus()}
  else if(a==="sendbuy"){if(needAcct("Crea tu cuenta para comprar."))return;
    var l=find(id);if(!l)return;
    var pay=document.querySelector('input[name="pay"]:checked'),sh=document.querySelector('input[name="ship"]:checked');
    var txt="Hola, quiero comprar «"+l.title+"» por "+usd(l.price)+" ("+bs(l.price)+"). Pago: "+(pay?lab(PAY,pay.value):"a convenir")+". Entrega: "+(sh?lab(SHIP,sh.value):"a convenir")+".";
    var tid=openChat(l);if(tid)sendMsg(tid,txt)
  }
  else if(a==="w-register"){$("#welcome").hidden=true;openAuth("register")}
  else if(a==="w-login"){$("#welcome").hidden=true;openAuth("login")}
  else if(a==="w-guest"){try{localStorage.setItem("lp_guest","1")}catch(x){}$("#welcome").hidden=true}
  else if(a==="auth-open"){openAuth(b.dataset.v)}
  else if(a==="auth-switch"){S.auth={mode:S.auth.mode==="login"?"register":"login",step:1,msg:"",d:S.auth.d||{}};renderSheet()}
  else if(a==="auth-back"){S.auth.step=1;S.auth.msg="";renderSheet()}
  else if(a==="auth-next"){authNext()}
  else if(a==="auth-verify"){authVerify()}
  else if(a==="terms"){openSheet({t:"terms"})}
  else if(a==="logout"){S.acct=null;try{localStorage.removeItem("lp_acct")}catch(x){}if(S.live)S.db.doc("data/users/"+S.uid+"/profile").set({favs:S.favs.slice(),acct:null}).catch(function(){});toast("Sesión cerrada");S.sub="";setTab("home")}
  else if(a==="sub"){S.sub=b.dataset.v;S.confirmDel=null;renderView();window.scrollTo(0,0)}
  else if(a==="help"){openSheet({t:"help"})}
  else if(a==="seller"){if(!id)return;openSheet({t:"seller",id:id,l:b.dataset.l})}
  else if(a==="saverate2"){var v2=parseFloat($("#rateSet").value);if(!(v2>0)){toast("Escribe una tasa mayor que cero");return}S.rate=v2;try{localStorage.setItem("lp_rate",String(v2))}catch(x){}renderChrome();toast("Tasa guardada")}
  else if(a==="saveship"){var sd={n:$("#sh-n").value.trim(),t:$("#sh-t").value.trim(),c:$("#sh-c").value.trim(),d:$("#sh-d").value.trim()};try{localStorage.setItem("lp_ship",JSON.stringify(sd))}catch(x){toast("No se pudo guardar en este dispositivo");return}toast("Datos guardados")}
  else if(a==="o-sendship"){
    var d5=shipData();
    if(!d5.n||!d5.d){closeSheet();goSub("ship");toast("Completa tus datos de entrega primero");return}
    var o5=getOrder(id),l5=o5&&find(o5.listingId);if(!l5){toast("Este anuncio ya no está disponible");return}
    var tid2=openChat(l5);if(tid2)sendMsg(tid2,"Mis datos de entrega: "+d5.n+", tel. "+(d5.t||"—")+", "+(d5.c||"")+". "+d5.d)
  }
  else if(a==="o-star"){var rt=$("#revIn");if(rt)S.pendTxt[id]=rt.value;S.pendRate[id]=parseInt(b.dataset.v,10);renderSheet()}
  else if(a==="o-review"){var n6=S.pendRate[id];if(!n6){toast("Elige de 1 a 5 estrellas");return}orderUpdate(id,{rating:n6,comment:(($("#revIn")||{}).value||"").trim().slice(0,300)})}
  else if(a==="m-edit"){S.editId=id;var le=find(id);S.draftImg=(le&&le.img)||null;setTab("sell")}
  else if(a==="m-boost"){listingUpdate(id,{boost:Date.now()}).then(function(ok){if(ok)toast("Anuncio destacado por 7 días (gratis en la prueba)")})}
  else if(a==="m-sold"){listingUpdate(id,{sold:true}).then(function(ok){if(ok)toast("Marcado como vendido")})}
  else if(a==="m-reopen"){listingUpdate(id,{sold:false}).then(function(ok){if(ok)toast("Anuncio reactivado")})}
  else if(a==="m-del"){
    if(S.confirmDel!==id){S.confirmDel=id;renderView();return}
    (async function(){
      try{if(S.live)await S.db.doc("listings/"+id).delete();else S.real=S.real.filter(function(l){return l.id!==id})}catch(x){toast("No se pudo eliminar el anuncio");return}
      S.confirmDel=null;toast("Anuncio eliminado");refresh()
    })()
  }
  else if(a==="cancel-edit"){S.editId=null;S.draftImg=null;goSub("mine")}
  else if(a==="off-send"){
    var ov=parseFloat($("#offIn").value);if(!(ov>0)){toast("Escribe un monto mayor que cero");return}
    var ot2=S.sheet&&S.sheet.t==="chat"?getThread(S.sheet.id):null;if(!ot2)return;
    ov=Math.round(ov*100)/100;var by=ot2.buyerId===myKey()?"buyer":"seller";
    sendMsg(ot2.id,(by==="buyer"?"Oferta: ":"Contraoferta: ")+usd(ov),{amount:ov,by:by,status:"pendiente"})
  }
  else if(a==="off-accept"||a==="off-reject"){
    var ot3=S.sheet&&S.sheet.t==="chat"?getThread(S.sheet.id):null;if(!ot3||!ot3.offer)return;
    var ok2=a==="off-accept";
    sendMsg(ot3.id,(ok2?"Acepté la oferta de ":"Rechacé la oferta de ")+usd(ot3.offer.amount),{amount:ot3.offer.amount,by:ot3.offer.by,status:ok2?"aceptada":"rechazada"})
  }
  else if(a==="off-buy"){
    var ot4=S.sheet&&S.sheet.t==="chat"?getThread(S.sheet.id):null;if(!ot4)return;
    var l4=find(ot4.listingId);if(!l4)return;
    S.sheet={t:"detail",id:l4.id};S.buy=true;renderSheet();var bx2=$("#buyBox");if(bx2)bx2.scrollIntoView({block:"center"})
  }
  else if(a==="mkorder"){if(needAcct("Crea tu cuenta para comprar con pago protegido."))return;
    var l3=find(id);if(!l3)return;
    if(S.uid&&l3.sellerId===S.uid){toast("Es tu anuncio: no puedes comprártelo.");return}
    var sh2=document.querySelector('input[name="ship"]:checked');
    createOrder(l3,sh2?sh2.value:"persona",agreedPrice(l3)).then(function(oid){if(oid){S.sheet={t:"order",id:oid};S.buy=false;renderSheet();$("#pbody").scrollTop=0}})
  }
  else if(a==="order"){S.opener=document.activeElement;S.sheet={t:"order",id:id};renderSheet();document.documentElement.style.overflow="hidden";$("#xbtn").focus()}
  else if(a==="o-pay"){var rf=($("#refIn").value||"").trim();if(rf.length<4){toast("Escribe al menos 4 dígitos de la referencia");return}orderUpdate(id,{status:"revision",ref:rf},"pagado")}
  else if(a==="o-cancel"){orderUpdate(id,{status:"cancelado"})}
  else if(a==="o-verify"){orderUpdate(id,{status:"retenido"},"retenido").then(function(ok){if(ok)markSold(getOrder(id))})}
  else if(a==="o-ship"){var tk=$("#trackIn")?$("#trackIn").value.trim():"";orderUpdate(id,{status:"enviado",track:tk},"enviado")}
  else if(a==="o-release"){orderUpdate(id,{status:"liberado"},"liberado")}
  else if(a==="o-problem"){orderUpdate(id,{status:"disputa"})}
  else if(a==="o-rate"){orderUpdate(id,{rating:parseInt(b.dataset.v,10)})}
  else if(a==="sold"){
    (async function(){
      try{if(S.live)await S.db.doc("listings/"+id).update({sold:true});else{var l2=find(id);if(l2)l2.sold=true}}catch(x){toast("No se pudo actualizar el anuncio");return}
      toast("Marcado como vendido");renderSheet();renderView()
    })()
  }
  else if(a==="del"){
    if(S.confirmDel!==id){S.confirmDel=id;renderSheet();return}
    (async function(){
      try{if(S.live)await S.db.doc("listings/"+id).delete();else S.real=S.real.filter(function(l){return l.id!==id})}catch(x){toast("No se pudo eliminar el anuncio");return}
      toast("Anuncio eliminado");closeSheet();renderView()
    })()
  }
});
document.addEventListener("submit",function(e){
  if(e.target.id==="sellForm"){e.preventDefault();publish()}
  else if(e.target.id==="chatForm"){e.preventDefault();var i=$("#chatIn"),v=i.value;i.value="";if(S.sheet&&S.sheet.t==="chat")sendMsg(S.sheet.id,v)}
});
document.addEventListener("change",function(e){
  if(e.target.id==="f-photo"&&e.target.files&&e.target.files[0]){
    readImg(e.target.files[0]).then(function(u){S.draftImg=u;$("#photoPrev").innerHTML='<img src="'+u+'" alt="Vista previa">'}).catch(function(){toast("No se pudo leer esa foto")})
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){S.q=e.target.value;renderView()}
  else if(e.target.id==="f-price"){var v=parseFloat(e.target.value);$("#priceHint").textContent=v>0?"≈ "+bs(v):""}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.sheet)closeSheet()});

/* ---------- datos compartidos ---------- */
function plain(d){var o=Object.assign({id:d.id},d.data());return o}
function mergeThreads(map,docs){docs.forEach(function(d){map.set(d.id,plain(d))})}
async function init(){
  try{
    var c=window.claude;if(!c||!c.use){S.ready=true;refresh();return}
    var res=await Promise.all([c.use("db"),c.use("user")]);
    S.db=res[0];S.user=res[1];
    if(S.user){S.uid=await S.user.id();try{S.me=await S.user.me()}catch(x){}}
    S.ready=true;
    if(!S.db||!S.uid){refresh();return}
    S.live=true;
    S.db.collection("listings").orderBy("ts","desc").limit(300).onSnapshot(function(snap){S.real=snap.docs.map(plain);refresh()},function(){S.live=false;toast("Se perdió la conexión con los anuncios");refresh()});
    try{var p=await S.db.doc("data/users/"+S.uid+"/profile").get();if(p.exists){var pd=p.data();if(Array.isArray(pd.favs))S.favs=pd.favs.slice();if(pd.acct&&pd.acct.u&&!S.acct){S.acct=pd.acct;try{localStorage.setItem("lp_acct",JSON.stringify(S.acct))}catch(x){}var w2=$("#welcome");if(w2)w2.hidden=true}}}catch(x){}
    var mine=new Map(),theirs=new Map(),pub=function(){var m=new Map();mine.forEach(function(v,k){m.set(k,v)});theirs.forEach(function(v,k){m.set(k,v)});S.threads=m;if(S.tab==="msgs")renderView();if(S.sheet&&S.sheet.t==="chat")updateChat()};
    S.db.collection("threads").where("buyerId","==",S.uid).onSnapshot(function(s){mine=new Map();mergeThreads(mine,s.docs);pub()},function(){});
    S.db.collection("threads").where("sellerId","==",S.uid).onSnapshot(function(s){theirs=new Map();mergeThreads(theirs,s.docs);pub()},function(){});
    var om=new Map(),ot=new Map(),opub=function(){var m=new Map();om.forEach(function(v,k){m.set(k,v)});ot.forEach(function(v,k){m.set(k,v)});S.orders=m;if(S.tab==="profile")renderView();renderChrome();if(S.sheet&&S.sheet.t==="order")renderSheet()};
    S.db.collection("orders").where("buyerId","==",S.uid).onSnapshot(function(s){om=new Map();mergeThreads(om,s.docs);opub()},function(){});
    S.db.collection("orders").where("sellerId","==",S.uid).onSnapshot(function(s){ot=new Map();mergeThreads(ot,s.docs);opub()},function(){});
    refresh()
  }catch(e){S.ready=true;refresh()}
}
showWelcome();
renderCats();renderChrome();renderView();
init();
})();
</script>
